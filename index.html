<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axtres Diagnostic Test</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 40px; text-align: center; }
        .box { background: #222; padding: 20px; border-radius: 10px; max-width: 500px; margin: 0 auto; border: 1px solid #444; }
        h2 { color: #4CAF50; }
        pre { background: #000; padding: 10px; text-align: left; overflow-x: auto; color: #ff5555; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Axtres Status: Online</h2>
        <p>If you see this box, HTML rendering is working correctly!</p>
        <hr style="margin: 20px 0; border-color: #444;">
        <p>Testing Backend API Connection...</p>
        <div id="api-status" style="font-weight: bold; margin-top: 10px;">Connecting...</div>
        <pre id="error-log"></pre>
    </div>

    <script>
        async function testBackend() {
            try {
                const res = await fetch('/messages');
                const text = await res.text();
                if (res.ok) {
                    document.getElementById('api-status').style.color = "#4CAF50";
                    document.getElementById('api-status').innerText = "SUCCESS! Connected to Cloudflare D1 Database.";
                    document.getElementById('error-log').innerText = "Database Response:\n" + text;
                } else {
                    document.getElementById('api-status').style.color = "#ff5555";
                    document.getElementById('api-status').innerText = "API Error (Status " + res.status + ")";
                    document.getElementById('error-log').innerText = text;
                }
            } catch (err) {
                document.getElementById('api-status').style.color = "#ff5555";
                document.getElementById('api-status').innerText = "Network / Fetch Failed";
                document.getElementById('error-log').innerText = err.toString();
            }
        }
        testBackend();
    </script>
</body>
</html>
