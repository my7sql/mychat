<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axtres Messenger</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
    input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    .chat-box { height: 300px; overflow-y: scroll; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; background: #fafafa; display: flex; flex-direction: column; }
    .message { margin-bottom: 8px; padding: 8px; border-radius: 6px; max-width: 80%; }
    .my-message { background: #dcf8c6; align-self: flex-end; }
    .other-message { background: #fff; border: 1px solid #ddd; align-self: flex-start; }
    .hidden { display: none !important; }
    .checkbox-container { display: flex; align-items: center; font-size: 14px; margin: 8px 0; }
    .checkbox-container input { width: auto; margin-right: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- LOGIN VIEW -->
    <div id="login-section">
      <h2>Axtres Login</h2>
      <input type="text" id="login-phone" placeholder="Enter Phone Number" required>
      <input type="text" id="login-name" placeholder="Enter Your Name" required>
      <input type="email" id="login-email" placeholder="Enter Your Email (for Email notifications)" required>
      <button onclick="handleLogin()">Login / Register</button>
    </div>

    <!-- CHAT VIEW -->
    <div id="chat-section" class="hidden">
      <h3>Welcome, <span id="user-display-name"></span></h3>
      <div>
        <input type="text" id="room-id-input" placeholder="Enter Room ID">
        <button onclick="joinRoom()">Join Room</button>
      </div>
      <div id="active-room-label" style="font-weight: bold; color: #555; margin: 5px 0;"></div>
      
      <div class="chat-box" id="chat-messages"></div>

      <textarea id="message-input" placeholder="Type a message..."></textarea>
      
      <div class="checkbox-container">
        <input type="checkbox" id="send-via-email">
        <label for="send-via-email">Also send via Email to recipient</label>
      </div>
      
      <input type="text" id="recipient-phone-input" placeholder="Recipient Phone Number (Required if Email selected)">
      <button onclick="sendMessage()">Send Message</button>
      <button onclick="handleLogout()" style="background: #dc3545; margin-top: 15px;">Logout</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentRoom = null;
    let pollInterval = null;

    // Check localStorage on load for persistent login during low battery / page reloads
    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("axtres_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showChatUI();
      }
    });

    function handleLogin() {
      const phone = document.getElementById("login-phone").value.trim();
      const name = document.getElementById("login-name").value.trim();
      const email = document.getElementById("login-email").value.trim();

      if (!phone || !name || !email) {
        alert("Please fill in all fields.");
        return;
      }

      currentUser = { phone, name, email };
      // Save permanently to localStorage so low battery RAM purging doesn't kick user out
      localStorage.setItem("axtres_user", JSON.stringify(currentUser));
      showChatUI();
    }

    function handleLogout() {
      localStorage.removeItem("axtres_user");
      currentUser = null;
      currentRoom = null;
      if (pollInterval) clearInterval(pollInterval);
      document.getElementById("chat-section").classList.add("hidden");
      document.getElementById("login-section").classList.remove("hidden");
    }

    function showChatUI() {
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("chat-section").classList.remove("hidden");
      document.getElementById("user-display-name").innerText = currentUser.name;
    }

    function joinRoom() {
      const roomId = document.getElementById("room-id-input").value.trim();
      if (!roomId) {
        alert("Please enter a Room ID");
        return;
      }
      currentRoom = roomId;
      document.getElementById("active-room-label").innerText = `Active Room: ${roomId}`;
      
      fetchMessages();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(fetchMessages, 3000); // Poll every 3 seconds
    }

    async function fetchMessages() {
      if (!currentRoom) return;
      try {
        const res = await fetch(`/messages?room_id=${encodeURIComponent(currentRoom)}`, {
          cache: "no-store"
        });
        if (!res.ok) return;
        const messages = await res.json();
        
        const chatBox = document.getElementById("chat-messages");
        chatBox.innerHTML = "";
        
        messages.forEach(m => {
          const div = document.createElement("div");
          div.className = `message ${m.senderPhone === currentUser.phone ? "my-message" : "other-message"}`;
          div.innerHTML = `<strong>${m.sender_name || 'User'}</strong>: ${m.message}`;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        console.error("Failed to fetch messages", e);
      }
    }

    async function sendMessage() {
      if (!currentRoom) {
        alert("Join a room first!");
        return;
      }
      const messageText = document.getElementById("message-input").value.trim();
      const sendViaEmail = document.getElementById("send-via-email").checked;
      const recipientPhone = document.getElementById("recipient-phone-input").value.trim();

      if (!messageText) return;

      if (sendViaEmail && !recipientPhone) {
        alert("Please enter the recipient phone number to send via email.");
        return;
      }

      // Also ensure recipient exists in DB or register them on the fly if needed
      if (sendViaEmail) {
        await fetch("/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: recipientPhone, name: "Recipient", email: recipientPhone + "@temp.com" }) // Adjust if you have a separate user registry endpoint
        }).catch(()=>{});
      }

      const payload = {
        room_id: currentRoom,
        sender_id: currentUser.phone,
        sender_name: currentUser.name,
        recipient_phone: recipientPhone,
        message: messageText,
        send_via_email: sendViaEmail ? 1 : 0,
        created_at: new Date().toISOString()
      };

      try {
        const res = await fetch("/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          document.getElementById("message-input").value = "";
          fetchMessages();
        } else {
          alert("Failed to send message.");
        }
      } catch (e) {
        alert("Network error while sending message.");
      }
    }

    // LOW BATTERY RESILIENCE: Force immediate sync the second the user wakes up their phone screen
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentRoom) {
        fetchMessages();
      }
    });

    window.addEventListener("pageshow", (event) => {
      if ((event.persisted || document.visibilityState === "visible") && currentRoom) {
        fetchMessages();
      }
    });
  </script>
</body>
</html>
